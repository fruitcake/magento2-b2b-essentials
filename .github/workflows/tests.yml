name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, soap, sodium, xsl, zip
          coverage: none

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate XML files
        run: |
          find etc -name '*.xml' -print0 | xargs -0 -n1 php -r '
            libxml_use_internal_errors(true);
            if (!(new DOMDocument())->load($argv[1])) {
                foreach (libxml_get_errors() as $e) {
                    fwrite(STDERR, $argv[1] . ":" . $e->line . ": " . trim($e->message) . PHP_EOL);
                }
                exit(1);
            }'

      - uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/phpunit
